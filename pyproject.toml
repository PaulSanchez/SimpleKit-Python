[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "event_graph_sim"
version = "3.4.0"
authors = [
  { name="Paul J Sanchez", email="prof.paul.sanchez@gmail.com" },
]
description = "A discrete event simulation modeling engine based on event graphs"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/PaulSanchez/simplekit-python"
